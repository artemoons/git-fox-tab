<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="screen-main" class="screen">
    <header class="header">
      <img src="../icons/icon-48.png" alt="" class="logo" />
      <h1>Git Fox Tab</h1>
    </header>

    <section id="status" class="status">
      <div class="status-row"><span>Windows</span><b id="stat-windows">—</b></div>
      <div class="status-row"><span>Tabs</span><b id="stat-tabs">—</b></div>
      <div class="status-row"><span>Groups</span><b id="stat-groups">—</b></div>
      <div class="status-row"><span>Containers</span><b id="stat-containers">—</b></div>
      <div class="status-row"><span>Saved</span><b id="stat-saved">—</b></div>
    </section>

    <div class="actions">
      <button id="btn-collect" class="btn primary">Collect &amp; save tabs</button>
      <button id="btn-push" class="btn">Push to Git</button>
      <button id="btn-pull" class="btn">Pull from Git</button>
      <button id="btn-export" class="btn">Export to file</button>
      <button id="btn-import" class="btn">Import from file</button>
      <button id="btn-restore" class="btn">Restore tabs</button>
      <button id="btn-restore-selected" class="btn">Restore selected tabs</button>
      <input type="file" id="file-input" accept="application/json,.json" hidden />
    </div>

    <footer class="footer">
      <a id="open-options" href="#">Settings</a>
    </footer>
  </div>

  <div id="screen-restore-selected" class="screen" hidden>
    <div class="rs-header">
      <button id="rs-back" class="icon-btn" title="Back" aria-label="Back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="rs-toggle" role="tablist">
        <button id="rs-tab-local" class="rs-toggle-btn" data-source="local" role="tab">Local</button>
        <button id="rs-tab-git" class="rs-toggle-btn" data-source="git" role="tab">Git</button>
      </div>
    </div>

    <div id="rs-empty" class="rs-empty" hidden>Backup is empty.</div>
    <div id="rs-list" class="rs-list"></div>

    <div class="rs-actions">
      <button id="rs-select-all-btn" class="btn rs-select-all" disabled>Select all</button>
      <button id="rs-restore-btn" class="btn primary" disabled>Restore selected</button>
    </div>
  </div>

  <div id="message" class="message" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
